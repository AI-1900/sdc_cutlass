<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="865" viewBox="0 0 1120 865" role="img" aria-label="计算拆分：盯住一个输出 tile，沿 K 一段段累加"><defs><marker id="arr-02-computation" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526977"/></marker></defs><rect width="1120" height="865" fill="#f5f8fa"/><text x="32" y="43" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#183544">计算拆分：盯住一个输出 tile，沿 K 一段段累加</text><text x="32" y="77" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#526977">示意：M=N=256，K=192；工作 tile 为 128×128，K 分块为 64。</text><text x="48" y="135" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#215b94">A：选中 M 块 × K₁</text><rect x="48" y="150" width="74" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="58" y="187.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">0,0</text><rect x="126" y="150" width="74" height="61" rx="3" fill="#e5f1ff" stroke="#c6d3da"/><text x="136" y="187.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">0,1</text><rect x="204" y="150" width="74" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="214" y="187.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">0,2</text><rect x="48" y="215" width="74" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="58" y="252.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">1,0</text><rect x="126" y="215" width="74" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="136" y="252.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">1,1</text><rect x="204" y="215" width="74" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="214" y="252.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">1,2</text><text x="305" y="224" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#183544">×</text><text x="350" y="135" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#215b94">B：K₁ × 选中 N 块</text><rect x="350" y="150" width="81" height="44" rx="3" fill="white" stroke="#c6d3da"/><text x="360" y="179.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">0,0</text><rect x="435" y="150" width="81" height="44" rx="3" fill="white" stroke="#c6d3da"/><text x="445" y="179.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">0,1</text><rect x="350" y="198" width="81" height="44" rx="3" fill="#e5f1ff" stroke="#c6d3da"/><text x="360" y="227.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">1,0</text><rect x="435" y="198" width="81" height="44" rx="3" fill="white" stroke="#c6d3da"/><text x="445" y="227.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">1,1</text><rect x="350" y="246" width="81" height="44" rx="3" fill="white" stroke="#c6d3da"/><text x="360" y="275.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">2,0</text><rect x="435" y="246" width="81" height="44" rx="3" fill="white" stroke="#c6d3da"/><text x="445" y="275.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">2,1</text><text x="548" y="224" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#183544">→</text><text x="610" y="135" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#215b94">输出：固定 tile (0,0)</text><rect x="610" y="150" width="81" height="61" rx="3" fill="#e5f1ff" stroke="#c6d3da"/><text x="620" y="187.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">0,0</text><rect x="695" y="150" width="81" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="705" y="187.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">0,1</text><rect x="610" y="215" width="81" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="620" y="252.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">1,0</text><rect x="695" y="215" width="81" height="61" rx="3" fill="white" stroke="#c6d3da"/><text x="705" y="252.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#183544">1,1</text><rect x="830" y="150" width="250" height="131" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="846" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">当前 K 分块 1</text><text x="846" y="212" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">A：128×64</text><text x="846" y="239" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">B：64×128</text><text x="32" y="345" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#183544">Mainloop：保持输出 tile 不变，只推进 K 分块</text><rect x="32" y="370" width="326" height="90" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="48" y="401" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">K₀</text><text x="48" y="432" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">Acc += A₀ × B₀</text><path d="M359 415L390 415" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-02-computation)"/><rect x="397" y="370" width="326" height="90" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="413" y="401" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">K₁</text><text x="413" y="432" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">Acc += A₁ × B₁</text><path d="M724 415L755 415" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-02-computation)"/><rect x="762" y="370" width="326" height="90" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="778" y="401" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">K₂</text><text x="778" y="432" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">Acc += A₂ × B₂</text><text x="32" y="510" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#183544">每个 K 分块内部：空间分工 + 时间协作</text><rect x="32" y="535" width="246" height="95" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="48" y="566" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">① 搬运</text><text x="48" y="597" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">GMEM → SMEM</text><path d="M279 580L300 580" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-02-computation)"/><rect x="306" y="535" width="246" height="95" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="322" y="566" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">② 就绪</text><text x="322" y="597" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">等待当前数据</text><path d="M553 580L574 580" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-02-computation)"/><rect x="580" y="535" width="246" height="95" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="596" y="566" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">③ MMA</text><text x="596" y="597" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">基本指令铺满 tile</text><path d="M827 580L848 580" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-02-computation)"/><rect x="854" y="535" width="246" height="95" rx="10" fill="#e5f1ff" stroke="#c6d3da"/><text x="870" y="566" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#215b94">④ 复用</text><text x="870" y="597" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">消费完成后释放</text><path d="M560 632L560 669" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-02-computation)"/><rect x="210" y="675" width="700" height="100" rx="10" fill="white" stroke="#c6d3da"/><text x="226" y="706" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#183544">Epilogue：全部 K 分块完成后处理输出</text><text x="226" y="737" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">D_tile = α · Acc + β · C_tile；可选 bias / 激活 / 类型转换</text><text x="32" y="842" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#526977">网格每格代表一个分块。MMA 的数据路径、累加位置与完成协议取决于架构；此图不表示真实耗时。</text></svg>