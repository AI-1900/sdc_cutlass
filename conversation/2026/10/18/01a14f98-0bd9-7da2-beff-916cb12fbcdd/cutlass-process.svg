<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="CUTLASS 组合、CuTe 映射与编译流程"><defs><marker id="cc-arrow-static" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#32667c"/></marker></defs><rect width="1100" height="660" fill="#f5f8fa"/><text x="32" y="42" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="25">CUTLASS：把专用 GEMM 的设计规则，变成可组合的代码</text><text x="32" y="78" fill="#526976" font-family="Microsoft YaHei, sans-serif" font-size="16">C++ 3.x 风格 API · 本地提交 ffa119a1 · 示意图，不代表实际硬件耗时</text><rect x="30" y="108" width="245" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="44" y="138" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">① 确定配置</text><text x="44" y="166" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">GPU / 类型 / 布局 / tile / schedule</text><rect x="310" y="108" width="350" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="324" y="138" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">② Builder 选择实现</text><text x="324" y="166" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">Mainloop + Epilogue → Kernel</text><rect x="695" y="108" width="375" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="709" y="138" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">③ Adapter 接收运行时参数</text><text x="709" y="166" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">M,N,K / 地址 / stride / α,β</text><path d="M276 149L307 149" fill="none" stroke="#32667c" stroke-width="2" marker-end="url(#cc-arrow-static)"/><path d="M662 149L692 149" fill="none" stroke="#32667c" stroke-width="2" marker-end="url(#cc-arrow-static)"/><text x="32" y="235" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="21">CuTe 空间映射：同一份 tile，连接线程视图与存储视图</text><rect x="30" y="257" width="245" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="44" y="287" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">(thread, value)</text><text x="44" y="315" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">参与线程 + 每线程的元素编号</text><rect x="310" y="257" width="350" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="324" y="287" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">逻辑坐标 / fragment</text><text x="324" y="315" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">Layout / Tensor / partition</text><rect x="695" y="257" width="375" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="709" y="287" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">实际操作数位置</text><text x="709" y="315" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">GMEM / SMEM / 寄存器 / descriptor</text><path d="M276 298L307 298" fill="none" stroke="#32667c" stroke-width="2" marker-end="url(#cc-arrow-static)"/><path d="M662 298L692 298" fill="none" stroke="#32667c" stroke-width="2" marker-end="url(#cc-arrow-static)"/><text x="32" y="388" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="21">编译落实：类型与静态映射，为目标指令提供具体实现</text><rect x="30" y="410" width="245" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="44" y="440" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">④ 模板特化与内联</text><text x="44" y="468" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">选择 Atom / Traits / Pipeline</text><rect x="310" y="410" width="350" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="324" y="440" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">CUDA 编译工具链</text><text x="324" y="468" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">常量折叠 / 索引化简 → PTX → SASS</text><rect x="695" y="410" width="375" height="82" rx="8" fill="#ffffff" stroke="#9bb4bf"/><text x="709" y="440" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">⑤ GPU 执行</text><text x="709" y="468" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="15">加载 ↔ MMA 流水线 → Epilogue → D</text><path d="M276 451L307 451" fill="none" stroke="#32667c" stroke-width="2" marker-end="url(#cc-arrow-static)"/><path d="M662 451L692 451" fill="none" stroke="#32667c" stroke-width="2" marker-end="url(#cc-arrow-static)"/><text x="32" y="548" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="20">时间协作：数据就绪 → 消费数据 → 等待所需完成 → 释放并复用缓冲</text><text x="32" y="587" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="18">CuTe 表达空间映射；Collective / Kernel 组织执行时序；目标架构约束二者。</text><text x="32" y="624" fill="#173343" font-family="Microsoft YaHei, sans-serif" font-size="18">性能来自分块复用、访存布局、矩阵指令、流水线与资源预算的共同匹配。</text></svg>