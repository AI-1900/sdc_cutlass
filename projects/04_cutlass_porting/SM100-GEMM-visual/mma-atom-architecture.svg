<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">SM100 1SM MMA atom 架构图</title><desc id="desc">TMA 把 A B 放入共享内存，描述符进入寄存器，单 lane 发射 tcgen05.mma，FP32 结果累加在 TMEM。</desc>
<defs><marker id="ma-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#8ba9c8" stroke-width="2"/></marker><style>.bg{fill:#0a1727}.panel{fill:#12263b;stroke:#37536d;stroke-width:2}.sm{fill:#241f43;stroke:#a998eb;stroke-width:2}.at{fill:#173a35;stroke:#91e3b7;stroke-width:2}.tm{fill:#44321e;stroke:#ffd07b;stroke-width:2}.t{fill:#eaf1fb;font:700 27px 'Microsoft YaHei',Arial,sans-serif}.h{fill:#eaf1fb;font:700 23px 'Microsoft YaHei',Arial,sans-serif}.b{fill:#b9c9db;font:17px 'Microsoft YaHei',Arial,sans-serif}.m{fill:#8fb3cd;font:15px Consolas,'Microsoft YaHei',monospace}.line{fill:none;stroke:#8ba9c8;stroke-width:3;marker-end:url(#ma-arrow)}.dash{fill:none;stroke:#56718e;stroke-width:2;stroke-dasharray:8 8}</style></defs>
<rect class="bg" width="1440" height="820"/><text x="60" y="64" class="t">一个 MMA atom：SMEM 输入 → 1SM UMMA → TMEM 累加</text><text x="60" y="98" class="b">本测例的一个 atom 逻辑工作量：FP16 A[64×16] × FP16 B[16×128] → FP32 Acc[64×128]</text>
<rect x="55" y="145" rx="18" width="270" height="230" class="panel"/><text x="81" y="186" class="h">GMEM / TMA</text><text x="81" y="227" class="b">A: FP16 RowMajor</text><text x="81" y="259" class="b">B: FP16 ColumnMajor</text><text x="81" y="307" class="m">TMA load → SMEM stage</text><text x="81" y="338" class="m">Collective::load</text>
<rect x="395" y="145" rx="18" width="330" height="230" class="sm"/><text x="423" y="186" class="h">SMEM A / B stage</text><text x="423" y="227" class="b">数据实际驻留在共享内存</text><text x="423" y="267" class="m">sA, sB → tCrA, tCrB</text><text x="423" y="302" class="b">本 K tile = 64，分成 4 片 × 16</text><text x="423" y="339" class="m">make_fragment_A/B</text>
<rect x="795" y="145" rx="18" width="250" height="230" class="panel"/><text x="821" y="186" class="h">描述符 / 寄存器</text><text x="821" y="231" class="m">desc_a : uint64</text><text x="821" y="266" class="m">desc_b : uint64</text><text x="821" y="301" class="m">idesc  : uint64</text><text x="821" y="339" class="b">地址与布局信息，不是矩阵值</text>
<rect x="1112" y="145" rx="18" width="270" height="230" class="at"/><text x="1138" y="186" class="h">1SM UMMA atom</text><text x="1138" y="229" class="m">SM100_MMA_F16BF16_SS</text><text x="1138" y="273" class="b">单个被选 lane 发射</text><text x="1138" y="316" class="m">tcgen05.mma</text><text x="1138" y="344" class="m">cta_group::1.kind::f16</text>
<path class="line" d="M325 259H392"/><path class="line" d="M725 259H791"/><path class="line" d="M1045 259H1108"/>
<rect x="795" y="460" rx="18" width="587" height="225" class="tm"/><text x="826" y="505" class="h">TMEM · FP32 accumulator [64×128]</text><text x="826" y="553" class="b">第 0 个 K 子步：ScaleOut::Zero，忽略旧 C</text><text x="826" y="589" class="b">后 3 个 K 子步：ScaleOut::One，继续累加</text><text x="826" y="637" class="m">结果交给 epilogue；不是由 atom 直接写 D</text><path class="line" d="M1247 376V455"/>
<rect x="55" y="460" rx="18" width="670" height="225" class="panel"/><text x="85" y="505" class="h">分层边界</text><text x="85" y="549" class="b">Collective：等 stage、沿 K 循环、管理累加与释放</text><text x="85" y="585" class="b">TiledMMA：把 SMEM tile 分成 atom 可消费的 fragment</text><text x="85" y="621" class="b">MMA_Atom / Traits：形状、类型、地址解包与硬件操作</text><path class="dash" d="M728 572H790"/>
<text x="60" y="751" class="b">注：cluster 1×4×1 是 CTA 级协作形状；并不表示一个 atom 做 4 次 cluster MMA。</text><text x="60" y="783" class="m">CUTLASS source ffa119a1255d · schematic, not measured timing</text>
</svg>
