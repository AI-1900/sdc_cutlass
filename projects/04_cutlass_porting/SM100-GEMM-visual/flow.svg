<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">SM100 GEMM Host 与 Device 流程图</title>
  <desc id="desc">展示 Host 的配置、参数构造、工作空间、设备启动，以及 Device 的 scheduler、TMA、UMMA、epilogue 和 CPU 验证顺序。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#eaf1fb}.h{font-size:36px;font-weight:700}.s{font-size:19px}.m{font-size:23px;font-weight:600}.muted{fill:#a8b8cd}.box{fill:#173149;stroke:#5c7995;stroke-width:2}.arrow{stroke:#86a5c3;stroke-width:3;fill:none;marker-end:url(#a)}.dashed{stroke:#86a5c3;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#a)}.host{fill:#63d7ea}.device{fill:#91e3b7}.verify{fill:#ffd07b}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#86a5c3"/></marker></defs>
  <rect width="1440" height="880" fill="#0a1727"/>
  <text x="60" y="70" class="h">执行流程：从 TEST 到 PASS</text>
  <text x="62" y="111" class="s muted">实线表示调用 / 数据交接；虚线表示循环取下一 work tile。</text>
  <text x="62" y="170" class="m host">HOST</text>
  <rect class="box" x="60" y="192" width="255" height="106" rx="12"/><text x="81" y="232" class="m">TEST / Builder</text><text x="81" y="263" class="s muted">确定 1SM TMA+UMMA</text>
  <path class="arrow" d="M317 245 H362"/>
  <rect class="box" x="365" y="192" width="292" height="106" rx="12"/><text x="386" y="232" class="m">TestAll / Testbed</text><text x="386" y="263" class="s muted">生成问题并填充 A/B</text>
  <path class="arrow" d="M659 245 H704"/>
  <rect class="box" x="707" y="192" width="315" height="106" rx="12"/><text x="728" y="232" class="m">Arguments / workspace</text><text x="728" y="263" class="s muted">检查约束并转换 Params</text>
  <path class="arrow" d="M1024 245 H1069"/>
  <rect class="box" x="1072" y="192" width="306" height="106" rx="12"/><text x="1093" y="232" class="m">Adapter::run</text><text x="1093" y="263" class="s muted">cluster launch 1×4×1</text>
  <path class="arrow" d="M1225 300 V358"/>
  <text x="62" y="390" class="m device">DEVICE</text>
  <rect class="box" x="60" y="416" width="235" height="112" rx="12"/><text x="80" y="458" class="m">device_kernel</text><text x="80" y="493" class="s muted">进入 GemmUniversal</text>
  <path class="arrow" d="M297 473 H340"/>
  <rect class="box" x="343" y="416" width="247" height="112" rx="12"/><text x="363" y="458" class="m">Sched warp</text><text x="363" y="493" class="s muted">获取 WorkTileInfo</text>
  <path class="arrow" d="M592 473 H635"/>
  <rect class="box" x="638" y="416" width="251" height="112" rx="12"/><text x="658" y="458" class="m">TMA load</text><text x="658" y="493" class="s muted">A/B → SMEM stages</text>
  <path class="arrow" d="M891 473 H934"/>
  <rect class="box" x="937" y="416" width="225" height="112" rx="12"/><text x="957" y="458" class="m">UMMA 1SM</text><text x="957" y="493" class="s muted">累加到 TMEM</text>
  <path class="arrow" d="M1164 473 H1207"/>
  <rect class="box" x="1210" y="416" width="168" height="112" rx="12"/><text x="1230" y="458" class="m">Epilogue</text><text x="1230" y="493" class="s muted">写 D</text>
  <path class="dashed" d="M1290 530 V585 H463 V530"/>
  <text x="657" y="577" class="s muted">若仍有有效 tile，继续循环</text>
  <path class="arrow" d="M1294 596 V711 H235 V733"/>
  <text x="62" y="716" class="m verify">VERIFY</text>
  <rect class="box" x="60" y="736" width="350" height="92" rx="12"/><text x="81" y="774" class="m">cudaDeviceSynchronize</text><text x="81" y="803" class="s muted">等待 D 写回完成</text>
  <path class="arrow" d="M412 783 H492"/>
  <rect class="box" x="495" y="736" width="350" height="92" rx="12"/><text x="516" y="774" class="m">CPU Gemm3x</text><text x="516" y="803" class="s muted">计算参考结果</text>
  <path class="arrow" d="M847 783 H927"/>
  <rect class="box" x="930" y="736" width="448" height="92" rx="12"/><text x="951" y="774" class="m">比较 reference D 与 device D</text><text x="951" y="803" class="s muted">相对误差检查 → PASS / FAIL</text>
</svg>
