<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">MMA atom 计算流程图</title><desc id="desc">构建类型，等待 TMA stage，创建描述符，四个 K 子步依次发射 MMA，FP32 留在 TMEM，交给 epilogue。</desc><defs><marker id="mf-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#91e3b7" stroke-width="2"/></marker><style>.bg{fill:#0a1727}.box{fill:#12263b;stroke:#42617c;stroke-width:2}.green{fill:#173a35;stroke:#91e3b7;stroke-width:2}.gold{fill:#44321e;stroke:#ffd07b;stroke-width:2}.t{fill:#eaf1fb;font:700 28px 'Microsoft YaHei',Arial}.h{fill:#eaf1fb;font:700 21px 'Microsoft YaHei',Arial}.b{fill:#afc2d7;font:16px 'Microsoft YaHei',Arial}.m{fill:#90aecb;font:15px Consolas,'Microsoft YaHei',monospace}.ln{fill:none;stroke:#91e3b7;stroke-width:3;marker-end:url(#mf-arrow)}</style></defs><rect class="bg" width="1440" height="850"/><text class="t" x="55" y="62">一次 K tile 内，atom 如何被调用？</text><text class="b" x="55" y="94">纵向读控制流；横向读 4 个 K 子步。每次子步覆盖 K=16，合计 CTA K=64。</text>
<rect class="box" x="55" y="132" rx="15" width="410" height="100"/><text class="h" x="78" y="170">① 编译期选型</text><text class="m" x="78" y="203">Builder → TiledMMA → MMA_Atom</text><path class="ln" d="M466 182H514"/>
<rect class="box" x="520" y="132" rx="15" width="410" height="100"/><text class="h" x="543" y="170">② 建立 fragment 视图</text><text class="m" x="543" y="203">mma_init → make_fragment_A/B</text><path class="ln" d="M931 182H979"/>
<rect class="box" x="985" y="132" rx="15" width="400" height="100"/><text class="h" x="1008" y="170">③ 等待 TMA stage 就绪</text><text class="m" x="1008" y="203">mainloop_pipeline.consumer_wait</text><path class="ln" d="M1184 233V290"/>
<rect class="green" x="55" y="296" rx="16" width="1330" height="315"/><text class="h" x="82" y="338">④ Collective::mma 的 k_block 循环 · 每格调用一次 cute::gemm</text>
<g><rect class="box" x="85" y="378" rx="12" width="280" height="145"/><text class="h" x="108" y="415">k_block 0</text><text class="m" x="108" y="452">K [0,16)</text><text class="b" x="108" y="488">ScaleOut::Zero</text><rect class="box" x="415" y="378" rx="12" width="280" height="145"/><text class="h" x="438" y="415">k_block 1</text><text class="m" x="438" y="452">K [16,32)</text><text class="b" x="438" y="488">ScaleOut::One</text><rect class="box" x="745" y="378" rx="12" width="280" height="145"/><text class="h" x="768" y="415">k_block 2</text><text class="m" x="768" y="452">K [32,48)</text><text class="b" x="768" y="488">ScaleOut::One</text><rect class="box" x="1075" y="378" rx="12" width="280" height="145"/><text class="h" x="1098" y="415">k_block 3</text><text class="m" x="1098" y="452">K [48,64)</text><text class="b" x="1098" y="488">ScaleOut::One</text></g><path class="ln" d="M366 451H410"/><path class="ln" d="M696 451H740"/><path class="ln" d="M1026 451H1070"/><text class="m" x="85" y="574">每次调用：cute::gemm → MMA_Atom::call → mma_unpack → fma → tcgen05.mma</text>
<path class="ln" d="M718 612V659"/><rect class="gold" x="365" y="665" rx="15" width="710" height="115"/><text class="h" x="394" y="705">⑤ 结果留在 TMEM，完成后交给 epilogue</text><text class="b" x="394" y="742">后续 K tile 继续累加；最终 epilogue 才完成 D 的写回。</text><text class="m" x="55" y="824">K 划分是从 Shape_MNK 的 K=16 与 CTA tile K=64 推导的概念图；省略边界 tile 和 pipeline 细节。</text></svg>
