<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-label="04  流水线：缓冲状态与工作重叠"><defs><marker id="arrow-04-pipeline" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#236caa"/></marker></defs><rect width="1100" height="650" rx="18" fill="#f7fafc"/><text x="30" y="39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#16324f" text-anchor="start">04  流水线：缓冲状态与工作重叠</text><text x="30" y="68" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#53687d" text-anchor="start">时间长度和 stage 数仅用于说明；真实时序需要在目标 GPU 上测量。</text><rect x="30" y="105" width="230" height="94" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="45" y="133" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">可写 / Empty</text><text x="45" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">旧消费者已释放</text><rect x="300" y="105" width="230" height="94" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="315" y="133" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">写入中 / Loading</text><text x="315" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">TMA 搬运并计入事务</text><rect x="570" y="105" width="230" height="94" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="585" y="133" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">可读 / Ready</text><text x="585" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">事务完成且满足可见性</text><rect x="840" y="105" width="230" height="94" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="855" y="133" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">使用中 / Reading</text><text x="855" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">MMA 仍可能读取 SMEM</text><path d="M260 150 L295 150" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-04-pipeline)"/><path d="M530 150 L565 150" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-04-pipeline)"/><path d="M800 150 L835 150" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-04-pipeline)"/><path d="M955 200 V238 H145 V205" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-04-pipeline)"/><text x="370" y="230" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="normal" fill="#53687d" text-anchor="start">MMA 完成相关读取 → consumer_release → 允许复用</text><text x="30" y="300" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="bold" fill="#16324f" text-anchor="start">示意时间线</text><text x="30" y="354" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#16324f" text-anchor="start">Producer / TMA</text><text x="30" y="429" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#16324f" text-anchor="start">Consumer / MMA</text><text x="30" y="504" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#16324f" text-anchor="start">Epilogue</text><rect x="230" y="325" width="119" height="54" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="245" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Load K0</text><rect x="360" y="325" width="119" height="54" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="375" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Load K1</text><rect x="490" y="325" width="119" height="54" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="505" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Load K2</text><rect x="620" y="325" width="119" height="54" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="635" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Load K3</text><rect x="360" y="400" width="119" height="54" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="375" y="428" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">MMA K0</text><rect x="490" y="400" width="119" height="54" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="505" y="428" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">MMA K1</text><rect x="620" y="400" width="119" height="54" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="635" y="428" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">MMA K2</text><rect x="750" y="400" width="119" height="54" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="765" y="428" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">MMA K3</text><rect x="880" y="475" width="119" height="54" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="895" y="503" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Store D</text><path d="M230 565 L1055 565" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-04-pipeline)"/><text x="650.5" y="558.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" fill="#53687d" text-anchor="start">时间推进</text><text x="30" y="610" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#53687d" text-anchor="start">关键：index 区分槽位，phase 区分复用轮次；发出异步指令不代表访问已经结束。</text></svg>