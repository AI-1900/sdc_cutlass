<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="05  从软件表示到机器指令"><defs><marker id="arrow-05-lowering-hardware" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#236caa"/></marker></defs><rect width="1100" height="620" rx="18" fill="#f7fafc"/><text x="30" y="39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#16324f" text-anchor="start">05  从软件表示到机器指令</text><text x="30" y="68" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#53687d" text-anchor="start">C++ 模板路径；Python DSL / CuTe IR 是另行进入编译栈的入口。</text><rect x="30" y="105" width="310" height="115" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="45" y="133" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">CUTLASS / CuTe</text><text x="45" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">模板实例、layout、atom</text><text x="45" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">CUDA C++ + 内联 PTX</text><rect x="395" y="105" width="310" height="115" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="410" y="133" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">CUDA 编译工具链</text><text x="410" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">编译 / PTX / ptxas</text><text x="410" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">fatbinary 可含 cubin/PTX</text><rect x="760" y="105" width="310" height="115" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="775" y="133" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">GPU 可执行机器码</text><text x="775" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">目标 SASS</text><text x="775" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">或驱动按需 JIT PTX</text><path d="M340 163 L390 163" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-05-lowering-hardware)"/><path d="M705 163 L755 163" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-05-lowering-hardware)"/><rect x="30" y="330" width="310" height="145" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="45" y="358" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">搬运与同步</text><text x="45" y="383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">TMA / cp.async</text><text x="45" y="406" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">GMEM → SMEM</text><text x="45" y="429" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">mbarrier / cluster 协作</text><rect x="395" y="330" width="310" height="145" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="410" y="358" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">矩阵乘加</text><text x="410" y="383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">SM80：mma.sync</text><text x="410" y="406" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">SM90：WGMMA / 寄存器 Acc</text><text x="410" y="429" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">SM100：UMMA / TMEM Acc</text><rect x="760" y="330" width="310" height="145" rx="10" fill="white" stroke="#a76025" stroke-width="1.6"/><text x="775" y="358" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#a76025" text-anchor="start">输出与资源</text><text x="775" y="383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">读取 accumulator</text><text x="775" y="406" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">融合、转换、写回 GMEM</text><text x="775" y="429" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">完成异步访问，再释放资源</text><path d="M915 220 L915 320" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-05-lowering-hardware)"/><path d="M760 287 L190 320" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-05-lowering-hardware)" stroke-dasharray="6 4"/><path d="M880 265 L550 320" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-05-lowering-hardware)" stroke-dasharray="6 4"/><text x="30" y="550" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#53687d" text-anchor="start">核对三个层次：源码是否封装了指令；编译产物是否包含目标指令；运行时是否走该路径。</text></svg>