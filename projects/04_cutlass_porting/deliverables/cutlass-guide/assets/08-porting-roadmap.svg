<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="775" viewBox="0 0 1100 775" role="img" aria-label="08  新硬件后端：先正确，再组合，最后优化"><defs><marker id="arrow-08-porting-roadmap" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#236caa"/></marker></defs><rect width="1100" height="775" rx="18" fill="#f7fafc"/><text x="30" y="39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#16324f" text-anchor="start">08  新硬件后端：先正确，再组合，最后优化</text><text x="30" y="68" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#53687d" text-anchor="start">这是基于源码耦合点提出的工程路线，不是现有的跨厂商插件 API。</text><rect x="35" y="96" width="765" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="124" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">M0 硬件契约</text><text x="50" y="149" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">线程、指令、存储、同步、工具链、runtime</text><path d="M410 164 L410 180" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-08-porting-roadmap)"/><rect x="35" y="184" width="765" height="68" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="50" y="212" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">M1 Atom / Traits</text><text x="50" y="237" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">独立 copy/MMA；逐元素映射与精度验证</text><path d="M410 252 L410 268" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-08-porting-roadmap)"/><rect x="35" y="272" width="765" height="68" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="50" y="300" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">M2 单 tile GEMM</text><text x="50" y="325" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">单缓冲、边界与参考结果；最小纵切片</text><path d="M410 340 L410 356" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-08-porting-roadmap)"/><rect x="35" y="360" width="765" height="68" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="50" y="388" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">M3 Pipeline</text><text x="50" y="413" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">多 stage、多轮复用；证明异步完成和可见性</text><path d="M410 428 L410 444" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-08-porting-roadmap)"/><rect x="35" y="448" width="765" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="476" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">M4 Kernel / 调度</text><text x="50" y="501" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">全网格、batch、stride、输出覆盖、资源回收</text><path d="M410 516 L410 532" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-08-porting-roadmap)"/><rect x="35" y="536" width="765" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">M5 Host / Runtime</text><text x="50" y="589" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">参数检查、workspace、launch、stream/event</text><path d="M410 604 L410 620" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-08-porting-roadmap)"/><rect x="35" y="624" width="765" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="652" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">M6 性能 / M7 高级能力</text><text x="50" y="677" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">代表形状调优；再加入融合、分 K、grouped</text><rect x="840" y="115" width="225" height="150" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="855" y="143" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">可复用的思想</text><text x="855" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">分块算法与布局代数</text><text x="855" y="191" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">组件分层与测试规范</text><text x="855" y="214" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">不等于直接复用 PTX</text><rect x="840" y="380" width="225" height="174" rx="10" fill="white" stroke="#a76025" stroke-width="1.6"/><text x="855" y="408" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#a76025" text-anchor="start">必须重新核对</text><text x="855" y="433" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">subgroup 参与语义</text><text x="855" y="456" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">地址空间与内存序</text><text x="855" y="479" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">异步完成与 barrier</text><text x="855" y="502" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">资源限额与 launch ABI</text><text x="35" y="751" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#53687d" text-anchor="start">验收层级分开记录：能编译 → 功能正确 → 使用矩阵单元 → 具备稳定性能。</text></svg>