<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="835" viewBox="0 0 1100 835" role="img" aria-label="03  一次 GEMM：Host → Kernel → Collective → 指令"><defs><marker id="arrow-03-gemm-execution" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#236caa"/></marker></defs><rect width="1100" height="835" rx="18" fill="#f7fafc"/><text x="30" y="39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#16324f" text-anchor="start">03  一次 GEMM：Host → Kernel → Collective → 指令</text><text x="30" y="68" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#53687d" text-anchor="start">代表路径：Hopper TMA + GMMA cooperative；其他 schedule 的分工和启动分支可能不同。</text><rect x="35" y="94" width="800" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="122" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">应用</text><text x="50" y="147" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">Arguments：M/N/K/L、A/B/C/D、stride、alpha/beta</text><path d="M430 162 L430 177" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-03-gemm-execution)"/><rect x="35" y="181" width="800" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="209" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Host Adapter</text><text x="50" y="234" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">can_implement → workspace → initialize → Params</text><path d="M430 249 L430 264" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-03-gemm-execution)"/><rect x="35" y="268" width="800" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="296" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">启动入口</text><text x="50" y="321" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">run：grid / block / SMEM / cluster → device_kernel</text><path d="M430 336 L430 351" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-03-gemm-execution)"/><rect x="35" y="355" width="800" height="68" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="50" y="383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">Kernel</text><text x="50" y="408" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">operator()：角色、pipeline、scheduler、工作 tile</text><path d="M430 423 L430 438" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-03-gemm-execution)"/><rect x="35" y="442" width="800" height="68" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="50" y="470" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">Collective mainloop</text><text x="50" y="495" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">load：TMA → SMEM；mma：等待输入 → CuTe GEMM</text><path d="M430 510 L430 525" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-03-gemm-execution)"/><rect x="35" y="529" width="800" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="557" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">CuTe / Atom</text><text x="50" y="582" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">gemm → MMA_Atom::call → traits::mma_unpack → fma</text><path d="M430 597 L430 612" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-03-gemm-execution)"/><rect x="35" y="616" width="800" height="68" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="50" y="644" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">架构操作</text><text x="50" y="669" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">内联 PTX：wgmma.mma_async...；异步完成协议</text><path d="M430 684 L430 699" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-03-gemm-execution)"/><rect x="35" y="703" width="800" height="68" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="50" y="731" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">Epilogue / 收尾</text><text x="50" y="756" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">Acc + C → 融合/转换 → D；tail → GPU 完成与检查</text><rect x="870" y="120" width="195" height="110" rx="10" fill="white" stroke="#a76025" stroke-width="1.6"/><text x="885" y="148" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#a76025" text-anchor="start">Host 阶段</text><text x="885" y="173" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">参数检查与准备</text><text x="885" y="196" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">launch 异步提交</text><rect x="870" 