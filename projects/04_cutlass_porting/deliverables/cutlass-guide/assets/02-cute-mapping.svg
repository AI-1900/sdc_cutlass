<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="545" viewBox="0 0 1100 545" role="img" aria-label="02  CuTe：坐标、线程、存储与操作"><defs><marker id="arrow-02-cute-mapping" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#236caa"/></marker></defs><rect width="1100" height="545" rx="18" fill="#f7fafc"/><text x="30" y="39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#16324f" text-anchor="start">02  CuTe：坐标、线程、存储与操作</text><text x="30" y="68" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#53687d" text-anchor="start">视图构造 / partition 不会自动搬运数据；copy 和 MMA 才对应实际硬件工作。</text><rect x="30" y="100" width="310" height="120" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="45" y="128" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">逻辑矩阵与坐标</text><text x="45" y="153" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">A[M,K] / B[N,K] / D[M,N]</text><text x="45" y="176" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">shape + stride → 线性偏移</text><text x="45" y="199" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">动态尺寸与编译期布局可混合</text><rect x="395" y="100" width="310" height="120" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="410" y="128" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Tensor = Engine + Layout</text><text x="410" y="153" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">Engine：访问/存储语境</text><text x="410" y="176" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">Layout：坐标映射</text><text x="410" y="199" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">GMEM / SMEM / RMEM / TMEM</text><rect x="760" y="100" width="310" height="120" rx="10" fill="white" stroke="#236caa" stroke-width="1.6"/><text x="775" y="128" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#236caa" text-anchor="start">Tiled 操作 / 线程切片</text><text x="775" y="153" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">TiledMMA / TiledCopy</text><text x="775" y="176" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">get_slice(thread_idx)</text><text x="775" y="199" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">partition_A/B/C 或 S/D</text><path d="M340 160 L390 160" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-02-cute-mapping)"/><path d="M705 160 L755 160" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-02-cute-mapping)"/><rect x="30" y="300" width="310" height="130" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="45" y="328" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">地址例：shape=(2,3)</text><text x="45" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">stride=(3,1)，偏移=3m+n</text><text x="45" y="376" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">第 0 行：0  1  2</text><text x="45" y="399" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">第 1 行：3  4  5</text><rect x="395" y="300" width="310" height="130" rx="10" fill="white" stroke="#137e79" stroke-width="1.6"/><text x="410" y="328" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#137e79" text-anchor="start">线程和值的映射</text><text x="410" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">哪些 lane 持有哪些 fragment</text><text x="410" y="376" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">哪些线程发射 / 参与指令</text><text x="410" y="399" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">逻辑布局 ≠ 物理内存连续性</text><rect x="760" y="300" width="310" height="130" rx="10" fill="white" stroke="#a76025" stroke-width="1.6"/><text x="775" y="328" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#a76025" text-anchor="start">Atom / Traits → 指令</text><text x="775" y="353" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">copy：触发实际搬运</text><text x="775" y="376" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">gemm：展开到 MMA 操作</text><text x="775" y="399" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#16324f" text-anchor="start">descriptor：编码硬件访问</text><path d="M915 220 L915 294" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-02-cute-mapping)"/><path d="M705 365 L755 365" stroke="#236caa" stroke-width="2" fill="none" marker-end="url(#arrow-02-cute-mapping)"/><text x="30" y="490" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#53687d" text-anchor="start">调试时分别记录：逻辑 shape/stride、线程角色、存储位置、数据生命周期。</text></svg>