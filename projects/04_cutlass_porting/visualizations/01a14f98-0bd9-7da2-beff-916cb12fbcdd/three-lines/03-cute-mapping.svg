<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="855" viewBox="0 0 1120 855" role="img" aria-label="数据分工：把“谁负责”与“数据在哪里”连接起来"><defs><marker id="arr-03-cute-mapping" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526977"/></marker></defs><rect width="1120" height="855" fill="#f5f8fa"/><text x="32" y="43" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#183544">数据分工：把“谁负责”与“数据在哪里”连接起来</text><text x="32" y="77" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#526977">4×4 教学 tile，4 个线程，每线程 4 个元素；这不是某条真实 MMA 的线程布局。</text><rect x="32" y="110" width="310" height="95" rx="10" fill="#e0f4ed" stroke="#c6d3da"/><text x="48" y="141" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#17664f">线程 / 值坐标</text><text x="48" y="172" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">(thread t, value v)</text><path d="M344 157L385 157" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-03-cute-mapping)"/><rect x="395" y="110" width="310" height="95" rx="10" fill="#e0f4ed" stroke="#c6d3da"/><text x="411" y="141" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#17664f">逻辑矩阵坐标</text><text x="411" y="172" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">(m, n)</text><path d="M707 157L748 157" stroke="#526977" stroke-width="1.7" fill="none" marker-end="url(#arr-03-cute-mapping)"/><rect x="758" y="110" width="330" height="95" rx="10" fill="#e0f4ed" stroke="#c6d3da"/><text x="774" y="141" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#17664f">存储索引 / 偏移</text><text x="774" y="172" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17"