, sans-serif" font-size="17" font-weight="400" fill="#183544">m = 1</text><text x="931" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">n = 2</text><text x="931" y="396" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">offset = 6</text><text x="931" y="423" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544"></text><text x="931" y="450" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">指针 + 偏移</text><text x="931" y="477" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">定位该元素</text><rect x="32" y="615" width="510" height="140" rx="10" fill="#e0f4ed" stroke="#c6d3da"/><text x="48" y="646" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#17664f">Layout：坐标到索引的映射</text><text x="48" y="677" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">Shape / Stride / 嵌套布局 / 组合变换</text><text x="48" y="704" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">Tensor：数据引擎 + Layout</text><text x="48" y="731" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">tile / partition：构造对应数据视图</text><rect x="578" y="615" width="510" height="140" rx="10" fill="#e0f4ed" stroke="#c6d3da"/><text x="594" y="646" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#17664f">Tiled 操作：匹配指令参与方式</text><text x="594" y="677" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#183544">get_slice(t)：取得线程切片</text><text x="594" y="704" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" 